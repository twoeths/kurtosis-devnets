id: builder-deposit-mixed-creds
name: "GLOAS: Invalid 0x01 validator deposits then a valid 0xb0 builder, same pubkey"
description: |
  Scenario 4 of the builder-deposit stress suite.

  Targets a SINGLE pubkey with two credential types in one payload-sized
  burst:
    1. `validatorDeposits` (default 5000) *validator* deposits with 0x01
       (eth1) credentials and invalid signatures, submitted FIRST.
    2. 1 *builder* deposit with 0xb0 credentials and a valid signature,
       submitted LAST.

  Why this is interesting:
    - All `validatorDeposits` validator deposits hit a pubkey that is unknown
      to the registry, so each fails its signature check and its ETH is burned.
    - The single valid 0xb0 deposit then onboards the builder for that same
      pubkey. A client must process the burns first and still correctly
      create the builder afterwards — distinguishing credential types for one
      pubkey and not letting the invalid prefix poison the valid deposit.
    - 5000 + 1 == 5001 fits within the per-block deposit limit (8192), so the
      whole set is meant to land in (about) one payload. Ordering is
      best-effort: Task A fully lands its EL receipts before Task B submits, so
      its deposits sit earlier in pending_deposits.

  Requires the `reuseIndex` flag on generate_batch_deposits (assertoor fork):
  both tasks use the SAME fresh mnemonic and startIndex 0, so both target the
  same derived pubkey.

  Submission is fire-and-forget at the consensus layer (awaitReceipt only).
  awaitInclusion is NOT used because it tracks deposits by pubkey and cannot
  count/distinguish same-pubkey deposits.
version: 1.0.0
tags: [gloas, builder, deposit, eip-6110, mixed-credentials, same-pubkey, burn, stability]
timeout: 2h
config:
  walletPrivkey: ''
  depositContract: '0x00000000219ab540356cBB839Cbe05303d7705Fa'
  # Invalid 0x01 validator deposits to pile onto the single pubkey first.
  validatorDeposits: 5000
  # Deposits per batch tx (CL validates every BLS signature individually).
  batchSize: 220
  # Hard cap of in-flight batch txs so we don't drown the mempool.
  pendingBatches: 32
  # Deposits per slot. 8192 = per-block deposit limit, so the validatorDeposits
  # invalid + 1 valid set (5001 by default) aims to land in (about) one payload.
  perSlot: 8192
  # ETH per deposit. 1 ETH is the floor (MIN_DEPOSIT_AMOUNT).
  depositAmount: 1
  # Set true to skip waiting for the GLOAS fork on long-running devnets.
  skipForkActivationCheck: false
tasks:
  - name: check_clients_are_healthy
    title: Check that at least one client is ready
    timeout: 5m
    config:
      minClientCount: 1

  - name: get_consensus_specs
    id: get_specs
    title: Get consensus chain specs
    if: "skipForkActivationCheck == false"

  - name: check_consensus_slot_range
    title: "Wait for GLOAS activation (epoch >= ${{ tasks.get_specs.outputs.specs.GLOAS_FORK_EPOCH }})"
    timeout: 1h
    if: "skipForkActivationCheck == false"
    configVars:
      minEpochNumber: "tasks.get_specs.outputs.specs.GLOAS_FORK_EPOCH"

  - name: check_consensus_block_proposals
    title: "Wait for block proposal to fix fee estimation"
    config:
      blockCount: 2
      checkLookback: 0

  - name: generate_child_wallet
    id: spam_wallet
    title: Generate funded wallet for the mixed-credential deposits
    config:
      walletSeed: builder-deposit-mixed-creds
    configVars:
      privateKey: walletPrivkey
      # (validatorDeposits + 1 builder) * depositAmount + 200 ETH headroom.
      prefundMinBalance: '| ((.validatorDeposits + 1) * .depositAmount + 200) * 1000000000000000000'

  - name: get_random_mnemonic
    id: spam_mnemonic
    title: Generate fresh mnemonic (only index 0 is ever used)

  # Task A: validatorDeposits invalid 0x01 validator deposits, all pinned to the
  # index-0 pubkey, each with a fresh random invalid signature. Submitted first.
  - name: generate_batch_deposits
    id: invalid_validators
    title: Spam ${validatorDeposits} invalid 0x01 validator deposits for one pubkey
    timeout: 90m
    config:
      reuseIndex: true
      startIndex: 0
      invalidSigPercent: 100
      awaitReceipt: true
      awaitInclusion: false
      failOnReject: true
    configVars:
      walletPrivkey: tasks.spam_wallet.outputs.childWallet.privkey
      mnemonic: tasks.spam_mnemonic.outputs.mnemonic
      depositContract: depositContract
      batchSize: batchSize
      limitTotal: validatorDeposits
      limitPerSlot: perSlot
      limitPendingBatches: pendingBatches
      depositAmount: depositAmount
      # 0x01 eth1 withdrawal credentials — version byte + 11 zero bytes + 20-byte address.
      withdrawalCredentials: '| "0x01" + ("00" * 11) + (.tasks.spam_wallet.outputs.childWallet.address | ltrimstr("0x"))'

  # Task B: one VALID 0xb0 builder deposit for the SAME pubkey (same mnemonic,
  # same index 0), reusing the batch contract deployed by Task A. Submitted last.
  - name: generate_batch_deposits
    id: valid_builder
    title: Submit the single valid 0xb0 builder deposit for the same pubkey
    timeout: 15m
    config:
      reuseIndex: true
      startIndex: 0
      invalidSigPercent: 0
      batchSize: 1
      awaitReceipt: true
      awaitInclusion: false
      failOnReject: true
    configVars:
      walletPrivkey: tasks.spam_wallet.outputs.childWallet.privkey
      mnemonic: tasks.spam_mnemonic.outputs.mnemonic
      depositContract: depositContract
      batchContract: tasks.invalid_validators.outputs.batchContract
      limitTotal: "| 1"
      depositAmount: depositAmount
      # 0xb0 builder withdrawal credentials — version byte + 11 zero bytes + 20-byte address.
      withdrawalCredentials: '| "0xb0" + ("00" * 11) + (.tasks.spam_wallet.outputs.childWallet.address | ltrimstr("0x"))'

  - name: check_consensus_finality
    title: Verify the chain still finalizes under mixed-credential deposit load
    timeout: 15m
    config:
      minFinalizedEpochs: 1
      maxUnfinalizedEpochs: 4
      failOnCheckMiss: true
