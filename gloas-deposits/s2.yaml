# Scenario 2: Mass builder onboarding at the fork.
# Spams valid 0xb0 builder deposits with unique pubkeys before Gloas activates
# (~8192 per block), building a 262144-deposit backlog that is onboarded at the
# fork. Lodestar pre-verifies the signatures in the 2 epochs before the fork, so
# onboarding should be all cache hits.
#
# Launch with ethereum-package@0350d2e98735ff395b088fe8c261f0c9bb652c8a (verified).
# Build the image from lodestar root: docker build -f Dockerfile.dev -t lodestar:local .
# Pass: on every CL, lodestar_stfn_gloas_onboard_builders_signature_checks{source="verified"} = 0
# and {source="cache"} = deposits onboarded = pending deposits at the fork.

participants_matrix:
  el:
    - el_type: geth
      el_image: ethpandaops/geth:glamsterdam-devnet-8
      el_extra_params: ["--rpc.txfeecap=0", "--rpc.gascap=0"]
  cl:
    - cl_type: lodestar
      cl_image: lodestar:local
  # more than 1 node: preverify is skipped on slots where the node is the next proposer
  count: 4

network_params:
  # epoch 2 so the 2-epoch pre-verify window starts at genesis and all deposits land before the fork
  gloas_fork_epoch: 2
  withdrawal_type: "0x01"
  validator_balance: 40000
  gas_limit: 200000000
  genesis_gaslimit: 200000000

additional_services:
  - assertoor

assertoor_params:
  image: jtraglia/assertoor
  run_stability_check: false
  run_block_proposal_check: false
  tests:
    - file: "https://raw.githubusercontent.com/twoeths/kurtosis-devnets/refs/heads/te/lodestar_fixes/playbooks/builder-deposit-spam.yaml"
      config:
        batchSize: 256
        pendingBatches: 32 # 8192 deposits per block
        totalDeposits: 262144
        skipForkActivationCheck: true
